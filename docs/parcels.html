  #stage.drag{cursor:grabbing}
  svg{width:100%;height:auto;display:block;overflow:visible}

  .hud{position:absolute;left:0;bottom:0;display:flex;gap:.45rem;align-items:center;

              background:rgba(255,255,255,.65);border:1px solid var(--rule);
              padding:.28rem .5rem;cursor:pointer;border-radius:3px}
  .hud button[aria-pressed=true]{background:var(--ink);color:var(--cream)}
  .ro{background:rgba(255,255,255,.5);padding:.28rem .45rem;border-radius:3px}

       color:var(--muted);font-weight:300;line-height:1.7}

function ink(hex){
  const n = parseInt(hex.slice(1), 16);
  const L = (0.299*((n>>16)&255) + 0.587*((n>>8)&255) + 0.114*(n&255)) / 255;
  return L > 0.62
    ? { fill:"#2A2A28", halo:"rgba(255,255,255,.85)" }
    : { fill:"#FFFFFF", halo:"rgba(30,34,28,.45)" };
}

// ── 街廓：[x0,y0,x1,y1, 色, 切分軸('x'|'y'), 地號清單, 疊層] ──

const ROADS = [

const ROAD_LABELS = [

  ["市政路",  (X.朝富+X.文心)/2, Y.市政+58,12],

  ["文心路",  X.文心+56,(Y.臺灣+Y.市政)/2,11],
  ["河南路",  X.河南, Y.市政+24,8.5],
  ["惠中路",  X.惠中, Y.臺灣-26,9],
  ["市政北一路", X.河南-46, Y.北一,8],
];

// ═══ 把街廓依權重切成地號 ═══════════════════
function subdivide(blk) {
  const [x0,y0,x1,y1] = blk.r;
  const total = blk.lots.reduce((s,l) => s + l.w, 0);
  const span = blk.axis === "x" ? (x1-x0) : (y1-y0);
  const GAP = blk.lots.length > 1 ? 4 : 0;   // 地籍線的縫
  const usable = span - GAP * (blk.lots.length - 1);
  let cur = blk.axis === "x" ? x0 : y0;
  return blk.lots.map(l => {
    const len = usable * (l.w / total);
    const rect = blk.axis === "x"
      ? [cur, y0, cur + len, y1]
      : [x0, cur, x1, cur + len];
    cur += len + GAP;
    const key = l.c || blk.c;
    return { rect, h: TALL.has(key) ? l.h : 0, name: l.n, lot: l.lot,
             color: C[key] || "#DDDDDD", tier: blk.tier || 0 };
  });
}
const LOTS = BLOCKS.flatMap(subdivide);

// ═══ 相機 ══════════════════════════════════
const CX = (X.朝富+X.文心)/2, CY = (Y.臺灣+Y.市政)/2;
const cam = { az:45, el:30, zoom:.56, panX:0, panY:0 };
const HOME = { ...cam };
const rad = d => d*Math.PI/180;

function proj(x,y,z){
  const a=rad(cam.az), e=rad(cam.el);
  const dx=x-CX, dy=y-CY;
  const rx=dx*Math.cos(a)-dy*Math.sin(a);
  const ry=dx*Math.sin(a)+dy*Math.cos(a);
  return [620+rx*cam.zoom+cam.panX,
          420+(ry*Math.sin(e)-z*Math.cos(e))*cam.zoom+cam.panY,
          ry];
}
const NORMALS=[[0,-1],[1,0],[0,1],[-1,0]];
function shade(hex,nx,ny){
  const a=rad(cam.az);
  const wx=nx*Math.cos(a)-ny*Math.sin(a), wy=nx*Math.sin(a)+ny*Math.cos(a);
  if(wy<=0.001) return null;
  return mix(hex, 0.62-0.16*wx-0.10*wy);
}
function mix(hex,k){
  const n=parseInt(hex.slice(1),16);
  return `rgb(${Math.round(((n>>16)&255)*k)},${Math.round(((n>>8)&255)*k)},${Math.round((n&255)*k)})`;
}
const pts = a => a.map(p=>`${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");

const svg = document.getElementById("map");
const DEFS = `<defs>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#8a8d82" flood-opacity="0.26"/></filter>
  <filter id="tiny" x="-45%" y="-45%" width="190%" height="190%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#4a4f46" flood-opacity="0.22"/></filter>
</defs>`;

function render(){
  const o=[DEFS];
  const PAD=95, TH=44, PAD_S=125;
  const cn=[[X.朝富-PAD,Y.臺灣-PAD],[X.文心+PAD,Y.臺灣-PAD],[X.文心+PAD,Y.市政+PAD_S],[X.朝富-PAD,Y.市政+PAD_S]];
  const tp=cn.map(([x,y])=>proj(x,y,0)), bt=cn.map(([x,y])=>proj(x,y,-TH));
  o.push(`<polygon points="${pts(tp)}" fill="#dfe0d3" filter="url(#soft)"/>`);
  for(let i=0;i<4;i++){
    const j=(i+1)%4, c=shade("#c8cabb",NORMALS[i][0],NORMALS[i][1]);
    if(c) o.push(`<polygon points="${pts([tp[i],tp[j],bt[j],bt[i]])}" fill="${c}"/>`);
  }
  o.push(`<polygon points="${pts(tp)}" fill="#e4e5d9"/>`);

  ROADS.forEach(([a,b,w])=>{
    const p1=proj(a[0],a[1],0), p2=proj(b[0],b[1],0);
    o.push(`<line x1="${p1[0].toFixed(1)}" y1="${p1[1].toFixed(1)}" x2="${p2[0].toFixed(1)}" y2="${p2[1].toFixed(1)}" stroke="#f0f0e6" stroke-width="${(w*cam.zoom/0.56).toFixed(1)}" stroke-linecap="round"/>`);
  });
  ROAD_LABELS.forEach(([t,x,y,s])=>{
    const p=proj(x,y,0);
    o.push(`<text x="${p[0].toFixed(1)}" y="${(p[1]+3).toFixed(1)}" text-anchor="middle" font-family="var(--mono)" font-size="${s}" fill="#9a9d91" letter-spacing=".06em">${t}</text>`);
  });

  const items = LOTS.map(L=>{
    const [x0,y0,x1,y1]=L.rect;
    return { L, d: proj((x0+x1)/2,(y0+y1)/2,0)[2] };
  }).sort((a,b)=>(a.L.tier-b.L.tier)||(a.d-b.d));

  items.forEach(({L})=>{
    const [x0,y0,x1,y1]=L.rect;
    const t=[proj(x0,y0,L.h),proj(x1,y0,L.h),proj(x1,y1,L.h),proj(x0,y1,L.h)];
    const g=[proj(x0,y0,0),proj(x1,y0,0),proj(x1,y1,0),proj(x0,y1,0)];
    if(L.h > 0){
      for(let i=0;i<4;i++){
        const j=(i+1)%4, c=shade(L.color,NORMALS[i][0],NORMALS[i][1]);
        if(c) o.push(`<polygon points="${pts([t[i],t[j],g[j],g[i]])}" fill="${c}"/>`);
      }
    }
    o.push(`<polygon points="${pts(t)}" fill="${L.color}" stroke="rgba(255,255,255,.5)" stroke-width=".8"/>`);

    // 公園小樹
    if(L.color === C.park && (x1-x0) > 100 && (y1-y0) > 60){
      const sc = cam.zoom / 0.56;
      for(let i=0;i<5;i++){
        const rx = x0 + (x1-x0) * (0.18 + 0.64 * ((i*0.37) % 1));
        const ry = y0 + (y1-y0) * (0.20 + 0.60 * ((i*0.61) % 1));
        const q = proj(rx, ry, L.h);
        o.push(`<ellipse cx="${q[0].toFixed(1)}" cy="${(q[1]-8*sc).toFixed(1)}" rx="${(5.2*sc).toFixed(1)}" ry="${(4.2*sc).toFixed(1)}" fill="#5f7d58" opacity=".85"/>`);
        o.push(`<ellipse cx="${q[0].toFixed(1)}" cy="${(q[1]-12*sc).toFixed(1)}" rx="${(3.8*sc).toFixed(1)}" ry="${(3*sc).toFixed(1)}" fill="#7a9a72" opacity=".9"/>`);
      }
    }

    if(L.name && cam.el>12 && cam.zoom>0.34){
      const p=proj((x0+x1)/2,(y0+y1)/2,L.h);
      const big = L.h>30 && L.name.length<9;
      const fs = L.name.length>7 ? 8.5 : (big?11:9.5);
      const dy = L.lot && cam.zoom>0.6 ? -1.5 : 3.5;
      const k = ink(L.color);
      o.push(`<text x="${p[0].toFixed(1)}" y="${(p[1]+dy).toFixed(1)}" text-anchor="middle" font-family="var(--sans)" font-weight="600" font-size="${fs}" fill="${k.fill}" stroke="${k.halo}" stroke-width="2.2" stroke-linejoin="round" paint-order="stroke">${L.name}</text>`);
      if(L.lot && cam.zoom>0.6){
        o.push(`<text x="${p[0].toFixed(1)}" y="${(p[1]+8).toFixed(1)}" text-anchor="middle" font-family="var(--mono)" font-size="6" fill="${k.fill}" opacity=".8" stroke="${k.halo}" stroke-width="1.5" paint-order="stroke">${L.lot}</text>`);
      }
    }
  });

  svg.innerHTML=o.join("");
  document.getElementById("ro").textContent =
    `方位 ${Math.round(((cam.az%360)+360)%360)}° · 仰角 ${Math.round(cam.el)}° · ${LOTS.filter(l=>l.name).length} 筆`;
}

// ═══ 互動 ═══════════════════════════════════
const stage=document.getElementById("stage");
let drag=null, raf=null;
const q=()=>{ if(!raf) raf=requestAnimationFrame(()=>{raf=null;render();}); };
function down(e){
  const p=e.touches?e.touches[0]:e;
  drag={x:p.clientX,y:p.clientY,pan:e.shiftKey||e.button===1,
        az:cam.az,el:cam.el,px:cam.panX,py:cam.panY};
  stage.classList.add("drag");
}
function move(e){
  if(!drag) return; e.preventDefault();
  const p=e.touches?e.touches[0]:e;
  const dx=p.clientX-drag.x, dy=p.clientY-drag.y;
  if(drag.pan){ cam.panX=drag.px+dx; cam.panY=drag.py+dy; }
  else { cam.az=drag.az+dx*0.4; cam.el=Math.max(4,Math.min(89,drag.el+dy*0.3)); }
  q();
}
const up=()=>{drag=null;stage.classList.remove("drag");};
stage.addEventListener("mousedown",down);
stage.addEventListener("touchstart",down,{passive:false});
addEventListener("mousemove",move); addEventListener("touchmove",move,{passive:false});
addEventListener("mouseup",up); addEventListener("touchend",up);
stage.addEventListener("contextmenu",e=>e.preventDefault());
stage.addEventListener("wheel",e=>{
  e.preventDefault();
  cam.zoom=Math.max(0.22,Math.min(1.8,cam.zoom*(e.deltaY>0?0.92:1.087))); q();
},{passive:false});

document.getElementById("reset").onclick=()=>{Object.assign(cam,HOME);render();};
const fb=document.getElementById("flat");
fb.onclick=()=>{
  const on = fb.getAttribute("aria-pressed")==="true";
  fb.setAttribute("aria-pressed", String(!on));
  cam.az = on?45:0; cam.el = on?30:89; render();
};

render();
</script>
</body>
</html>
